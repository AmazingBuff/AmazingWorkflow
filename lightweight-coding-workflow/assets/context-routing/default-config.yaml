schema_version: "2.0"
active_mode: balanced
config_id: context-routing-defaults
config_revision: 2

# Canonical effective defaults for the lightweight-coding-workflow PLAN task
# routing reference. validate_plan.py reads this file; a plan records its
# revision, digest, economics, and checked policy snapshot.

routing_policy:
  # Context economics, not a file/token minimum, chooses direct, micro, or
  # batch handling. These are decision hints; each plan records its estimates.
  allowed_decisions: ["direct", "micro", "batch"]
  decision_basis: "context-economics"
  coordination_overhead_tokens: 200
  direct_preferences: ["evidence-already-present", "tiny-evidence", "continuous-planner-judgment"]
  micro_max_tasks: 1
  batch_min_tasks: 2

mode_profiles:
  # Every budget value in a profile is a maximum. Plans may select lower
  # values, subject to the validator's worst-case dispatch checks.
  lean:
    max_subagents: 2
    max_input_tokens_per_task: 8000
    max_total_dispatched_tokens: 18000
    max_accidental_overlap_ratio: 0.05
    max_shared_source_tokens_per_task: 800
    default_expansion_mode: request
    default_expansion_tokens: 1500

  balanced:
    max_subagents: 3
    max_input_tokens_per_task: 12000
    max_total_dispatched_tokens: 30000
    max_accidental_overlap_ratio: 0.10
    max_shared_source_tokens_per_task: 1200
    default_expansion_mode: request
    default_expansion_tokens: 2500

  independent-review:
    max_subagents: 4
    max_input_tokens_per_task: 16000
    max_total_dispatched_tokens: 50000
    max_accidental_overlap_ratio: 0.08
    max_shared_source_tokens_per_task: 1500
    default_expansion_mode: request
    default_expansion_tokens: 3500

  high-assurance:
    max_subagents: 5
    max_input_tokens_per_task: 20000
    max_total_dispatched_tokens: 80000
    max_accidental_overlap_ratio: 0.08
    max_shared_source_tokens_per_task: 2000
    default_expansion_mode: request
    default_expansion_tokens: 4000

scout_policy:
  # The stable lightweight_scout id now names a task-scoped Evidence Task
  # Agent. A request-mode expansion is read only after Planner approval.
  allowed_expansion_modes: ["deny", "request"]
  planner_approval_required_for_request: true
  sandbox_mode: "read-only"
  pass_parent_transcript: false
  response_schema_version: "2.0"
  return_contract: "evidence-packet"
  agent_id: "lightweight_scout"
  task_kinds: ["dependency-check", "evidence-analysis", "repository-read", "requirement-research"]

plan_task_policy:
  # Pre-authorized Codex PLAN-task defaults. The adapter must validate the
  # exact model and effort before dispatch; other hosts may use direct PLAN
  # handling when they cannot represent this policy.
  model: "gpt-5.6-luna"
  reasoning_effort: "max"
  max_concurrent_tasks: 2
  max_estimated_input_tokens_per_round: 12000
  pass_parent_transcript: false
  sandbox_mode: "read-only"
  allow_writes: false
  allow_external_mutations: false
  user_visible_dispatch_notice: true
  per_task_approval_required: false
  over_policy: "user-approval-or-direct-fallback"

model_routing:
  # The Planner remains the only decision maker. PLAN task model/effort and
  # policy are explicit in the authorization; WORK keeps its separate
  # user-approved implementation model.
  planner_tier: "expensive (current main-task model)"
  plan_task_tier: "pre-authorized Codex Luna/max within policy"
  plan_task_model_source: "explicit policy plus adapter validation"
  implementer_tier: "user-approved implementation model"
