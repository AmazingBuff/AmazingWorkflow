schema_version: "1.0"
active_mode: balanced

# Baseline budgets for scout orchestration under the lightweight-coding-workflow
# Context Routing reference (protocol 0.6). This file is a planning baseline the
# Planner copies values from; the scripts do not read it. Effective values must
# be recorded in the plan's budget object so execution is reproducible.

routing_gate:
  # Enter the orchestrated lane above either threshold; otherwise use the
  # fast lane (direct Planner inspection). Tune from measured runs.
  max_files_direct: 5
  max_estimated_tokens_direct: 8000

mode_profiles:
  lean:
    max_subagents: 2
    max_input_tokens_per_task: 8000
    max_total_dispatched_tokens: 18000
    max_accidental_overlap_ratio: 0.05
    max_shared_source_tokens_per_task: 800
    default_expansion_mode: request
    default_expansion_tokens: 1500

  balanced:
    max_subagents: 3
    max_input_tokens_per_task: 12000
    max_total_dispatched_tokens: 30000
    max_accidental_overlap_ratio: 0.10
    max_shared_source_tokens_per_task: 1200
    default_expansion_mode: request
    default_expansion_tokens: 2500

  independent-review:
    max_subagents: 4
    max_input_tokens_per_task: 16000
    max_total_dispatched_tokens: 50000
    max_accidental_overlap_ratio: 0.08
    max_shared_source_tokens_per_task: 1500
    default_expansion_mode: request
    default_expansion_tokens: 3500

  high-assurance:
    max_subagents: 5
    max_input_tokens_per_task: 20000
    max_total_dispatched_tokens: 80000
    max_accidental_overlap_ratio: 0.08
    max_shared_source_tokens_per_task: 2000
    default_expansion_mode: request
    default_expansion_tokens: 4000

scout_policy:
  # Scouts are read-only Phase 1 workers; they never self-expand beyond
  # scheduler-approved requests.
  allow_modes: ["request", "deny"]
  forbid_modes: ["bounded"]
  pass_parent_transcript: false
  return_contract: "evidence-packet"

model_routing:
  # Tiers are defaults, not silent choices; the scout model is presented in
  # the proposal and validated through the host adapter before dispatch.
  planner_tier: "expensive (current main-task model)"
  scout_tier: "cheap (user-approved override allowed)"
  implementer_tier: "user-approved implementation model"
